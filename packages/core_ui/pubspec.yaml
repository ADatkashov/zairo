name: core_ui
description: Factory Core — the shared design system (color, typography, spacing, motion) every vertical's Flutter app themes itself with. No knowledge of any app or vertical.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  core_region:
    path: ../core_region
  # The Customer App Redesign board renders every icon via Google's Material
  # Symbols Rounded font (<span class="material-symbols-rounded">), not
  # Flutter's bundled classic Material Icons font — visually distinct glyphs
  # even for an icon with the same name.
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

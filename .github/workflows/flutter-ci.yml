name: Flutter CI

# Validates every Flutter package in the workspace (apps/user_app,
# apps/business_admin, apps/platform_admin, packages/core_network, packages/core_region,
# packages/core_storage, packages/core_ui). Each one resolves its
# path: dependencies via plain `flutter pub get` (see README.md's
# "Flutter workspace" section) — melos is a convenience for local dev,
# not required for CI, so it's deliberately not installed here.
#
# The repo is public, so GitHub-hosted runners are free. Runs on every push to
# develop/test/main/master and on every pull request, except for changes that
# touch no code (docs, scripts).
on:
  push:
    branches: [develop, test, main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".circleci/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".circleci/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Cancel a stale run on the same branch/PR when new commits land.
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches the Flutter SDK this repo is developed against (see
  # `flutter --version` / the `sdk: ^3.13.0` constraint shared by every
  # pubspec.yaml in apps/ and packages/). Pinned rather than "stable" so
  # CI doesn't silently shift under an unrelated PR when a new Flutter
  # release ships.
  FLUTTER_VERSION: "3.47.0"

jobs:
  flutter:
    name: flutter (analyze + test, all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      # Every package is checked even if an earlier one fails, so one run shows
      # all the problems (a second run costs minutes). The format check is gone:
      # it was report-only and cost a step per package.
      - name: Analyze and test every package
        run: |
          failed=()
          for pkg in apps/user_app apps/business_admin apps/platform_admin \
                     packages/core_network packages/core_region packages/core_storage packages/core_ui; do
            echo "::group::$pkg"
            (
              cd "$pkg"
              flutter pub get
              flutter analyze
              # core_network / core_storage have no tests; a bare `flutter test` would fail there.
              if find test -name '*_test.dart' -type f 2>/dev/null | grep -q .; then
                flutter test
              else
                echo "::warning::$pkg has no *_test.dart files, flutter test skipped"
              fi
            ) || failed+=("$pkg")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Failed: ${failed[*]}"
            exit 1
          fi

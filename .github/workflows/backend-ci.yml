name: Backend CI

# Builds and tests the Spring Boot modular monolith in backend/. Postgres
# is provisioned per test run by Testcontainers itself (see
# platform-api's TestcontainersConfiguration) — no Postgres service
# needed here. MinIO is NOT Testcontainerized (see StorageApiTests'
# javadoc), so it's started manually below with the same image/creds
# infrastructure/docker-compose.yml uses for local dev.
#
# MINUTES: the repo is private, so this draws on the free 2000 Actions minutes a
# month. It therefore runs ONLY on a push to `test` (i.e. after you merge
# develop -> test) or when started by hand. Not on pull requests (a PR into
# `test` plus the merge push would count twice), not on develop/master, and not
# for changes that touch no code. See docs/ci-cd.md "Actions minutes".
on:
  push:
    branches: [test]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - ".circleci/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (build + test)
    # Repo variable CI_RUNS_ON switches to a self-hosted runner, e.g.
    # ["self-hosted","linux"] (docs/ci-cd.md "Self-hosted runner"); unset = GitHub-hosted.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    # A hung Testcontainers/Gradle run must not burn minutes for hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matches subprojects { java { toolchain { languageVersion = 21 } } }
      # in backend/build.gradle.kts.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Caches the Gradle wrapper distribution, dependencies, and build
      # cache; also validates the wrapper jar's checksum against Gradle's
      # published values.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Self-hosted runner keeps ~/.gradle on disk; skip the cloud cache
          # (it counts against the Actions storage quota).
          cache-disabled: ${{ vars.CI_RUNS_ON != '' }}

      # Same image, port mapping, and dev-only credentials as
      # infrastructure/docker-compose.yml's minio service — StorageApiTests
      # talks to these exact values via application.yml's app.storage.*
      # defaults (http://localhost:9000 / app_factory / app_factory_secret).
      # Started with `docker run` rather than a `services:` container
      # because the official minio/minio image has no default CMD — it
      # requires an explicit `server /data` argument, which the `services:`
      # block has no field for.
      - name: Start MinIO
        run: |
          # A self-hosted runner is persistent: drop a leftover container from a cancelled run.
          docker rm -f minio >/dev/null 2>&1 || true
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=app_factory \
            -e MINIO_ROOT_PASSWORD=app_factory_secret \
            bitnamilegacy/minio:2025.7.23-debian-12-r5

      - name: Wait for MinIO to be ready
        run: |
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then
              echo "MinIO is up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO did not become ready in time"
          docker logs minio
          exit 1

      # backend/gradlew is committed without the executable bit (this repo
      # is developed on Windows, where that bit doesn't really exist) —
      # every Linux checkout needs this before `./gradlew` will run.
      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x gradlew

      - name: Build and test (./gradlew build)
        working-directory: backend
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/**/build/reports/tests/**
          retention-days: 3
          if-no-files-found: ignore

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

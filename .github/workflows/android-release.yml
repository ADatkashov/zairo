name: Android Release

# A REAL release-signed Android build — separate on purpose from
# build-artifacts.yml, which runs on every push to develop/test/master and
# produces debug-signed APKs for quick internal QA (see that file's own
# comments). This workflow is never triggered automatically: cutting a
# signed release is a deliberate action, not a side effect of a routine
# push. See docs/ci-cd.md's "Android release signing" section for the full
# secrets setup and how the shared keystore was generated.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to build"
        required: true
        type: choice
        options: [both, user_app, business_admin]
        default: both

# To create a GitHub Release and attach files to it. Every other workflow
# in this repo stays on the default `contents: read` — this is the one
# job that needs write access, scoped to this file only.
permissions:
  contents: write

env:
  # Matches flutter-ci.yml / build-artifacts.yml — keep all three in sync
  # if this ever changes.
  FLUTTER_VERSION: "3.47.0"

jobs:
  release:
    name: release (${{ matrix.app }})
    runs-on: ubuntu-latest
    if: ${{ inputs.app == 'both' || inputs.app == matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: user_app
            secret_suffix: USER_APP
          - app: business_admin
            secret_suffix: BUSINESS_ADMIN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP/Kotlin toolchain — same version as build-artifacts.yml's
      # android-apk job.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: flutter pub get
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # Fails loudly here, with a clear message, rather than letting a
      # missing secret surface as an opaque Gradle signing error several
      # steps later. Unlike android/app/build.gradle.kts's local-dev
      # fallback to debug signing, this workflow's entire purpose is a
      # real release build — there is no sensible fallback here.
      - name: Check required secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets[format('ANDROID_KEY_ALIAS_{0}', matrix.secret_suffix)] }}
          KEY_PASSWORD: ${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', matrix.secret_suffix)] }}
        run: |
          missing=()
          [ -z "$KEYSTORE_B64" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "$STORE_PASSWORD" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "$KEY_ALIAS" ] && missing+=("ANDROID_KEY_ALIAS_${{ matrix.secret_suffix }}")
          [ -z "$KEY_PASSWORD" ] && missing+=("ANDROID_KEY_PASSWORD_${{ matrix.secret_suffix }}")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}. See docs/ci-cd.md's 'Android release signing' section for how to create and add them."
            exit 1
          fi

      # Decoded into $RUNNER_TEMP, never into the checked-out repo — this
      # runner is destroyed after the job either way, but there is no
      # reason to put a decoded private key anywhere git could ever see it.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"

      # Same android/key.properties file format android/app/build.gradle.kts
      # already knows how to read for a local dev's own release build (see
      # docs/ci-cd.md) — CI and local signing share one code path.
      - name: Write key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets[format('ANDROID_KEY_ALIAS_{0}', matrix.secret_suffix)] }}
          KEY_PASSWORD: ${{ secrets[format('ANDROID_KEY_PASSWORD_{0}', matrix.secret_suffix)] }}
        run: |
          cat > apps/${{ matrix.app }}/android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - name: Read app version from pubspec.yaml
        id: version
        working-directory: apps/${{ matrix.app }}
        run: |
          version_name=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      # Same MAPS_API_KEY wiring as build-artifacts.yml's android-apk job
      # (see that file's comment) — has to reach the build both as a plain
      # env var (build.gradle.kts's native manifest placeholder) and as
      # --dart-define (maps_providers.dart's renderer selection). Only
      # relevant for user_app; business_admin ignores it harmlessly.
      - name: flutter build apk --release
        working-directory: apps/${{ matrix.app }}
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release --dart-define=MAPS_API_KEY="$MAPS_API_KEY"

      - name: flutter build appbundle --release
        working-directory: apps/${{ matrix.app }}
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build appbundle --release --dart-define=MAPS_API_KEY="$MAPS_API_KEY"

      - name: Rename outputs for clarity
        run: |
          mkdir -p release-out
          cp "apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk" \
             "release-out/${{ matrix.app }}-${{ steps.version.outputs.name }}.apk"
          cp "apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab" \
             "release-out/${{ matrix.app }}-${{ steps.version.outputs.name }}.aab"

      # A GitHub Release gives a permanent, stable, one-tap download link —
      # unlike a workflow-run artifact, it doesn't expire, isn't zipped,
      # and opens straight from a phone browser. One release per app per
      # run (the tag includes both the app name and the run number, so
      # repeated manual dispatches never collide).
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ matrix.app }}-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          name: "${{ matrix.app }} v${{ steps.version.outputs.name }} (build ${{ github.run_number }})"
          target_commitish: ${{ github.sha }}
          files: |
            release-out/${{ matrix.app }}-${{ steps.version.outputs.name }}.apk
            release-out/${{ matrix.app }}-${{ steps.version.outputs.name }}.aab
          body: |
            Release-signed build of `${{ matrix.app }}` from commit `${{ github.sha }}`.

            - **APK** — install directly on an Android device.
            - **AAB** — upload to Google Play Console.

      # Runs last, unconditionally — the decoded keystore and plaintext
      # key.properties should not linger on the runner (or in a later
      # step's working tree) any longer than the steps that actually need
      # them, regardless of whether the build or the release step failed.
      - name: Remove decoded keystore and key.properties
        if: always()
        run: |
          rm -f "apps/${{ matrix.app }}/android/key.properties"
          rm -rf "$RUNNER_TEMP/keystore"

name: Build Artifacts

# Runs on every push to `main` and by hand. It doesn't re-validate anything
# (flutter-ci.yml / backend-ci.yml do that); it only builds the backend jar and
# attaches it to the run (Artifacts, kept 14 days). Android APKs are NOT built
# here any more: the real release-signed ones come from android-release.yml.
#
# Nothing here is published anywhere public, and nothing deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  # The live backend (see infra/render setup) — without this, a release
  # APK falls back to environment.dart's local-dev default
  # (http://10.0.2.2:8080/api/v1, the Android-emulator-only loopback
  # alias), which is unreachable from a real phone and makes every
  # network call — including login — fail silently against a dead
  # address rather than the real backend.
  API_BASE_URL: "https://zairo-backend.onrender.com/api/v1"

jobs:
  backend-jar:
    name: backend-jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # See backend-ci.yml's identical step — backend/gradlew is committed
      # without the executable bit.
      - name: Make gradlew executable
        working-directory: backend
        run: chmod +x gradlew

      # platform-api is the only runnable module (application { mainClass
      # = PlatformApiApplication } in its build.gradle.kts) — it pulls
      # every bounded-context module in as a dependency, so its bootJar
      # is the one deployable artifact for the whole backend.
      - name: Build bootJar
        working-directory: backend
        run: ./gradlew :platform-api:bootJar

      # Spring Boot's Gradle plugin produces two jars here: the real
      # executable bootJar (platform-api-<version>.jar) and a
      # classes-only "-plain" jar it keeps for library consumers. Only
      # the former is useful as a runnable artifact.
      - name: Upload bootJar
        uses: actions/upload-artifact@v7
        with:
          name: platform-api-bootjar
          path: |
            backend/platform-api/build/libs/*.jar
            !backend/platform-api/build/libs/*-plain.jar
          retention-days: 14

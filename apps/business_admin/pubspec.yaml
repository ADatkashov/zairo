name: business_admin
description: "Business Admin — provider-owner tool for managing salons, services, availability, and bookings."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  dio: ^5.11.1
  # Every photo-upload flow (avatar, staff photos, cover photo, portfolio)
  # picks from camera/gallery, then crops/zooms/rotates before upload (see
  # pick_and_crop_image.dart) — file_picker's raw file-chooser is no longer
  # used anywhere in this app.
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  core_network:
    path: ../../packages/core_network
  core_storage:
    path: ../../packages/core_storage
  core_ui:
    path: ../../packages/core_ui
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  json_annotation: ^4.12.0
  # Sign-in methods shared with the consumer app: Google and Sign in with Apple
  # only obtain a credential on-device; the backend verifies it.
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only used in tests to build a bare SecureStorageService(FlutterSecureStorage())
  # for fake subclasses — the app itself only touches it through core_storage.
  flutter_secure_storage: ^11.2.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  generate: true

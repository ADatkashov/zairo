<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="zairo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>zairo</title>
  <link rel="manifest" href="manifest.json">

  <!--
    google_maps_flutter_web needs the JS Maps SDK loaded with a real key —
    unlike Android/iOS, there's no build tool that substitutes this
    automatically today. GOOGLE_MAPS_JS_API_KEY_PLACEHOLDER must be
    replaced with a real key (e.g. via `sed` in the build/deploy step,
    the same way `--base-href` is substituted) before this script tag does
    anything real; with the placeholder still in place the JS SDK simply
    fails to load, which only matters if GoogleMapsRenderer is actually
    selected (see maps_providers.dart — it isn't, without a matching
    --dart-define=MAPS_API_KEY on the Dart build).
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=GOOGLE_MAPS_JS_API_KEY_PLACEHOLDER" async></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

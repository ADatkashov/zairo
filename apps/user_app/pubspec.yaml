name: zairo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  # Used directly (not just through core_network) for Options() when a
  # request needs an explicit header before core_network's AuthTokenHolder
  # is populated — see AuthApi.me.
  dio: ^5.11.0
  core_network:
    path: ../../packages/core_network
  core_storage:
    path: ../../packages/core_storage
  core_ui:
    path: ../../packages/core_ui
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  # Profile > About: reads the real running app version/build number
  # rather than a hardcoded string that drifts from pubspec.yaml.
  package_info_plus: ^10.2.1
  # Profile > Support: opens the support Telegram link.
  url_launcher: ^6.3.0
  # The Customer App Redesign board renders every icon via Google's Material
  # Symbols Rounded font, not Flutter's bundled classic Material Icons font —
  # visually distinct glyphs even for an icon with the same name. Used by
  # category_icon.dart so category icons render pixel-equivalent to the
  # mockup rather than just semantically equivalent.
  material_symbols_icons: ^4.2960.0
  # Profile avatar upload — pinned to this exact pre-release for the same
  # reason as apps/business_admin's identical dependency (see its pubspec):
  # stable 12.0.0's readAsBytes()/blob-fetch rewrite hangs indefinitely on
  # web, so this stays on the older withData/PlatformFile.bytes path.
  file_picker: 12.0.0-beta.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  # Only used in tests to build a bare SecureStorageService(FlutterSecureStorage())
  # for fake subclasses — the app itself only touches it through core_storage.
  flutter_secure_storage: ^11.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

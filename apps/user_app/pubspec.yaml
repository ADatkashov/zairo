name: zairo
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  # Used directly (not just through core_network) for Options() when a
  # request needs an explicit header before core_network's AuthTokenHolder
  # is populated — see AuthApi.me.
  dio: ^5.11.1
  core_network:
    path: ../../packages/core_network
  core_storage:
    path: ../../packages/core_storage
  core_ui:
    path: ../../packages/core_ui
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  # Profile > About: reads the real running app version/build number
  # rather than a hardcoded string that drifts from pubspec.yaml.
  package_info_plus: ^10.2.1
  # Profile > Support: opens the support Telegram link.
  url_launcher: ^6.3.0
  # The Customer App Redesign board renders every icon via Google's Material
  # Symbols Rounded font, not Flutter's bundled classic Material Icons font —
  # visually distinct glyphs even for an icon with the same name. Used by
  # category_icon.dart so category icons render pixel-equivalent to the
  # mockup rather than just semantically equivalent.
  material_symbols_icons: ^4.2960.0
  # Profile avatar: pick from camera/gallery, then crop/zoom/rotate before
  # upload (see pick_and_crop_image.dart).
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  # Multi-provider auth (see features/auth). Google/Facebook only obtain a
  # provider credential on-device — the backend is what actually verifies
  # it (GoogleIdTokenVerifierAdapter/FacebookGraphIdentityVerifier); see
  # docs/authentication.md for the required Android/iOS/backend
  # configuration these two need before they work end-to-end.
  google_sign_in: ^7.2.0
  # Sign in with Apple (iOS): obtains an identity token on-device; the backend
  # verifies it against Apple's keys (AppleIdTokenVerifierAdapter). Required by
  # App Store rule 4.8 because Google sign-in is offered.
  sign_in_with_apple: ^7.0.1
  # flutter_facebook_auth's desktop variant (facebook_auth_desktop, pulled
  # in for the linux/macos/windows targets this workspace's apps still
  # carry folders for) has never tracked flutter_secure_storage past its
  # 9.x/10.x majors, which conflicts with core_storage's ^11.0.0 — see the
  # dependency_overrides entry below for how that's resolved.
  flutter_facebook_auth: ^7.2.0
  # Local biometric unlock (Face ID/Fingerprint) gating the already-
  # securely-stored refresh token on app restart — see BiometricAuthService
  # and docs/authentication.md's "Biometric architecture" section. Talks
  # only to the platform's own biometric APIs; nothing biometric is ever
  # sent to or stored by the backend.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  freezed: ^4.0.1
  # Only used in tests to build a bare SecureStorageService(FlutterSecureStorage())
  # for fake subclasses — the app itself only touches it through core_storage.
  flutter_secure_storage: ^11.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

# facebook_auth_desktop (flutter_facebook_auth's transitive desktop-platform
# dependency — see the comment on flutter_facebook_auth above) pins
# flutter_secure_storage to an old major that has no overlap with
# core_storage's ^11.0.0. Overriding it here forces one resolved version
# across the whole dependency graph instead of a version-solving conflict;
# safe because this app never actually ships the desktop targets
# facebook_auth_desktop's own code exercises — mobile Google/Facebook Login
# is Android/iOS only (see docs/authentication.md).
dependency_overrides:
  flutter_secure_storage: ^11.0.0

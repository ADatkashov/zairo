version: 2.1

jobs:
  build-android-apk:
    parameters:
      app_dir:
        type: string
      artifact_name:
        type: string
    docker:
      - image: ubuntu:jammy
    environment:
      FLUTTER_HOME: /home/flutter
      ANDROID_HOME: /home/android
      # Without this the APK falls back to http://10.0.2.2:8080/api/v1 (emulator-only
      # loopback) and every request fails on a real phone.
      API_BASE_URL: https://zairo-backend.onrender.com/api/v1
      PATH: /home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:/home/android/cmdline-tools/latest/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git openssh-client curl wget unzip openjdk-17-jdk-headless
      - checkout
      - run:
          name: Install Flutter
          command: |
            mkdir -p /home/flutter
            git clone https://github.com/flutter/flutter.git /home/flutter
            cd /home/flutter
            git checkout stable
            export PATH=/home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:$PATH
            flutter doctor
      - run:
          name: Install Android SDK
          command: |
            mkdir -p /home/android/cmdline-tools
            cd /tmp
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
            unzip -q commandlinetools-linux-9477386_latest.zip
            mv cmdline-tools /home/android/cmdline-tools/latest

            # Accept licenses
            yes | /home/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

            # Install required SDK components
            /home/android/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

            # AGP resolves compileSdk=37 to platforms/android-37, SDK installs android-37.0
            ln -sfn /home/android/platforms/android-37.0 /home/android/platforms/android-37
            ls -la /home/android/platforms
      - run:
          name: Install Dependencies
          working_directory: << parameters.app_dir >>
          command: flutter pub get
      - run:
          name: Generate Build Files
          working_directory: << parameters.app_dir >>
          command: |
            if grep -q build_runner pubspec.yaml; then
              flutter pub run build_runner build --delete-conflicting-outputs
            else
              echo "no code generation in this app"
            fi
      - run:
          name: Build Flutter APK
          working_directory: << parameters.app_dir >>
          command: |
            flutter build apk \
              --release \
              --build-name=1.0.0 \
              --build-number=${CIRCLE_BUILD_NUM} \
              --dart-define=API_BASE_URL="$API_BASE_URL" \
              --dart-define=MAPS_API_KEY="${MAPS_API_KEY:-}"
      - store_artifacts:
          path: << parameters.app_dir >>/build/app/outputs/flutter-apk/app-release.apk
          destination: << parameters.artifact_name >>

  build-for-testing:
    docker:
      - image: ubuntu:jammy
    environment:
      FLUTTER_HOME: /home/flutter
      PATH: /home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git openssh-client curl wget unzip openjdk-17-jdk-headless
      - checkout
      - run:
          name: Install Flutter
          command: |
            mkdir -p /home/flutter
            git clone https://github.com/flutter/flutter.git /home/flutter
            cd /home/flutter
            git checkout stable
            export PATH=/home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:$PATH
            flutter doctor
      - run:
          name: Install Dependencies
          working_directory: apps/user_app
          command: flutter pub get
      - run:
          name: Generate Build Files
          working_directory: apps/user_app
          command: flutter pub run build_runner build --delete-conflicting-outputs
      - run:
          name: Run Flutter Tests
          working_directory: apps/user_app
          command: flutter test
      - run:
          name: Analyze Flutter Code
          working_directory: apps/user_app
          command: flutter analyze

workflows:
  flutter-ci:
    jobs:
      - build-for-testing:
          filters:
            branches:
              only:
                - develop
                - test
                - master
      - build-android-apk:
          name: build-android-apk-user
          app_dir: apps/user_app
          artifact_name: user-app-release.apk
          filters:
            branches:
              only:
                - develop
          requires:
            - build-for-testing
      - build-android-apk:
          name: build-android-apk-business
          app_dir: apps/business_admin
          artifact_name: business-admin-release.apk
          filters:
            branches:
              only:
                - develop
          requires:
            - build-for-testing

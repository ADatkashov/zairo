version: 2.1

jobs:
  build-android-apk:
    docker:
      - image: circleci/android:api-30
    environment:
      FLUTTER_HOME: /home/circleci/flutter
      PATH: /home/circleci/flutter/bin:/home/circleci/flutter/bin/cache/dart-sdk/bin:$PATH
    steps:
      - run:
          name: Install SSH
          command: apt-get update && apt-get install -y openssh-client
      - checkout
      - run:
          name: Install Flutter
          command: |
            cd $HOME
            git clone https://github.com/flutter/flutter.git
            cd flutter
            git checkout stable
      - run:
          name: Install Dependencies
          working_directory: apps/user_app
          command: |
            flutter pub get
      - run:
          name: Build Flutter APK
          working_directory: apps/user_app
          command: |
            flutter build apk \
              --release \
              --build-name=1.0.0 \
              --build-number=${CIRCLE_BUILD_NUM}
      - run:
          name: Upload APK to Google Play Console
          command: |
            cd apps/user_app

            # Download bundletool
            mkdir -p bundletool-dir
            cd bundletool-dir
            wget -q https://github.com/google/bundletool/releases/latest/download/bundletool-all.jar -O bundletool.jar

            # Upload APK using bundletool
            java -jar bundletool.jar upload-apk \
              --apk-paths=../build/app/outputs/flutter-apk/app-release.apk \
              --service-account-json=<(echo ${GCLOUD_SERVICE_ACCOUNT_CREDENTIALS})
      - store_artifacts:
          path: apps/user_app/build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk

  build-for-testing:
    docker:
      - image: circleci/android:api-30
    environment:
      FLUTTER_HOME: /home/circleci/flutter
      PATH: /home/circleci/flutter/bin:/home/circleci/flutter/bin/cache/dart-sdk/bin:$PATH
    steps:
      - run:
          name: Install SSH
          command: apt-get update && apt-get install -y openssh-client
      - checkout
      - run:
          name: Install Flutter
          command: |
            cd $HOME
            git clone https://github.com/flutter/flutter.git
            cd flutter
            git checkout stable
      - run:
          name: Install Dependencies
          working_directory: apps/user_app
          command: flutter pub get
      - run:
          name: Run Flutter Tests
          working_directory: apps/user_app
          command: flutter test
      - run:
          name: Analyze Flutter Code
          working_directory: apps/user_app
          command: flutter analyze

workflows:
  flutter-ci:
    jobs:
      - build-for-testing:
          filters:
            branches:
              only:
                - develop
                - test
                - master
      - build-android-apk:
          filters:
            branches:
              only:
                - master
          requires:
            - build-for-testing

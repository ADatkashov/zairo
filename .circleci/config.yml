version: 2.1

jobs:
  build-android-apk:
    parameters:
      app_dir:
        type: string
      artifact_name:
        type: string
    docker:
      - image: ubuntu:jammy
    environment:
      FLUTTER_HOME: /home/flutter
      ANDROID_HOME: /home/android
      # Without this the APK falls back to http://10.0.2.2:8080/api/v1 (emulator-only
      # loopback) and every request fails on a real phone.
      API_BASE_URL: https://zairo-backend.onrender.com/api/v1
      PATH: /home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:/home/android/cmdline-tools/latest/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git openssh-client curl wget unzip openjdk-17-jdk-headless
      - checkout
      - run:
          name: Install Flutter
          command: |
            mkdir -p /home/flutter
            git clone https://github.com/flutter/flutter.git /home/flutter
            cd /home/flutter
            git checkout stable
            export PATH=/home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:$PATH
            flutter doctor
      - run:
          name: Install Android SDK
          command: |
            # Google's download servers now and then hand back a truncated or
            # corrupt archive ("Archive is not a ZIP archive"), which used to fail
            # a whole build at random (the NDK, or platform 35 inside Gradle).
            # Retry the downloads, dropping sdkmanager's partial files in between.
            retry() {
              local attempt=1
              until "$@"; do
                if [ "$attempt" -ge 3 ]; then
                  echo "giving up after $attempt attempts: $*"
                  return 1
                fi
                echo "attempt $attempt failed, retrying: $*"
                rm -rf /home/android/.temp
                attempt=$((attempt + 1))
                sleep 5
              done
            }

            mkdir -p /home/android/cmdline-tools
            cd /tmp
            retry wget -q -O commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
            unzip -q commandlinetools.zip
            mv cmdline-tools /home/android/cmdline-tools/latest

            # Accept licenses
            yes | /home/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

            # Install required SDK components. Platform 35 is installed here too:
            # a plugin (jni_flutter) compiles against it, and Gradle would
            # otherwise download it on its own, without any retry.
            retry /home/android/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

            # AGP resolves compileSdk=37 to platforms/android-37, SDK installs android-37.0
            ln -sfn /home/android/platforms/android-37.0 /home/android/platforms/android-37
            ls -la /home/android/platforms
      - run:
          name: Install Dependencies
          working_directory: << parameters.app_dir >>
          command: flutter pub get
      - run:
          name: Generate Build Files
          working_directory: << parameters.app_dir >>
          command: |
            if grep -q build_runner pubspec.yaml; then
              flutter pub run build_runner build --delete-conflicting-outputs
            else
              echo "no code generation in this app"
            fi
      - run:
          # The default Docker executor has ~4 GB of RAM, but the apps'
          # android/gradle.properties allow an 8 GB Gradle heap (fine on a
          # developer machine). Gradle and the Kotlin daemon together then
          # outgrow the container and the kernel kills the daemon mid-build
          # ("Gradle build daemon disappeared unexpectedly"). Cap them here, for
          # CI only: ~/.gradle/gradle.properties outranks the project's file.
          name: Fit Gradle into the executor's memory
          command: |
            mkdir -p ~/.gradle
            printf '%s\n' \
              'org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError' \
              'kotlin.daemon.jvmargs=-Xmx1g' \
              'org.gradle.workers.max=2' >> ~/.gradle/gradle.properties
            cat ~/.gradle/gradle.properties
      - run:
          name: Build Flutter APK
          working_directory: << parameters.app_dir >>
          command: |
            flutter build apk \
              --release \
              --build-name=1.0.0 \
              --build-number=${CIRCLE_BUILD_NUM} \
              --dart-define=API_BASE_URL="$API_BASE_URL" \
              --dart-define=MAPS_API_KEY="${MAPS_API_KEY:-}" \
              --dart-define=GOOGLE_OAUTH_SERVER_CLIENT_ID="${GOOGLE_OAUTH_SERVER_CLIENT_ID:-}"
      - store_artifacts:
          path: << parameters.app_dir >>/build/app/outputs/flutter-apk/app-release.apk
          destination: << parameters.artifact_name >>

  build-for-testing:
    docker:
      - image: ubuntu:jammy
    environment:
      FLUTTER_HOME: /home/flutter
      PATH: /home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git openssh-client curl wget unzip openjdk-17-jdk-headless
      - checkout
      - run:
          name: Install Flutter
          command: |
            mkdir -p /home/flutter
            git clone https://github.com/flutter/flutter.git /home/flutter
            cd /home/flutter
            git checkout stable
            export PATH=/home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:$PATH
            flutter doctor
      - run:
          name: Install Dependencies
          working_directory: apps/user_app
          command: flutter pub get
      - run:
          name: Generate Build Files
          working_directory: apps/user_app
          command: flutter pub run build_runner build --delete-conflicting-outputs
      - run:
          name: Run Flutter Tests
          working_directory: apps/user_app
          command: flutter test
      - run:
          name: Analyze Flutter Code
          working_directory: apps/user_app
          command: flutter analyze

  # The platform console (apps/platform_admin) is web-first, so besides
  # analyze + test this also proves the release web build compiles.
  test-platform-admin:
    docker:
      - image: ubuntu:jammy
    environment:
      FLUTTER_HOME: /home/flutter
      PATH: /home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git openssh-client curl wget unzip
      - checkout
      - run:
          name: Install Flutter
          command: |
            mkdir -p /home/flutter
            git clone https://github.com/flutter/flutter.git /home/flutter
            cd /home/flutter
            git checkout stable
            export PATH=/home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:$PATH
            flutter doctor
      - run:
          name: Install Dependencies
          working_directory: apps/platform_admin
          command: flutter pub get
      - run:
          name: Analyze Flutter Code
          working_directory: apps/platform_admin
          command: flutter analyze
      - run:
          name: Run Flutter Tests
          working_directory: apps/platform_admin
          command: flutter test
      - run:
          name: Build the web console
          working_directory: apps/platform_admin
          command: flutter build web --release --dart-define=API_BASE_URL=https://zairo-backend.onrender.com/api/v1
      - store_artifacts:
          path: apps/platform_admin/build/web
          destination: platform-admin-web

  # ---------------------------------------------------------------------------
  # Automated checks (added 2026-10-12). GitHub Actions is not usable for now,
  # so these are the repo's test gate. Unlike the APK builds above they are not
  # limited to the `test` branch -- see the `checks` workflow at the bottom.
  # ---------------------------------------------------------------------------

  # Fast backend gate: every module's plain unit tests. No database or Docker
  # needed, so it runs on the cheap Docker executor.
  backend-unit-tests:
    docker:
      - image: cimg/openjdk:21.0
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "backend/build.gradle.kts" }}
            - gradle-v1-
      - run:
          name: Unit tests (every module except platform-api)
          working_directory: backend
          command: |
            chmod +x gradlew
            ./gradlew test -x :platform-api:test --continue
      - save_cache:
          key: gradle-v1-{{ checksum "backend/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Collect JUnit results and HTML reports
          when: always
          command: |
            mkdir -p /tmp/junit /tmp/reports
            for d in backend/*/build/test-results/test; do
              [ -d "$d" ] || continue
              m=$(echo "$d" | cut -d/ -f2)
              mkdir -p "/tmp/junit/$m" && cp "$d"/*.xml "/tmp/junit/$m/" 2>/dev/null || true
            done
            for d in backend/*/build/reports/tests/test; do
              [ -d "$d" ] || continue
              m=$(echo "$d" | cut -d/ -f2)
              cp -r "$d" "/tmp/reports/$m"
            done
      - store_test_results:
          path: /tmp/junit
          when: always
      - store_artifacts:
          path: /tmp/reports
          destination: backend-test-reports
          when: on_fail

  # End-to-end API tests of platform-api. They start PostgreSQL through
  # Testcontainers, so this needs a real Docker daemon (machine executor), and
  # StorageApiTests talks to a MinIO on localhost:9000.
  backend-api-tests:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: Install JDK 21
          command: |
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk-headless
            echo 'export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64' >> "$BASH_ENV"
            echo 'export PATH=$JAVA_HOME/bin:$PATH' >> "$BASH_ENV"
      - run:
          name: Start MinIO
          command: |
            docker run -d --name minio -p 9000:9000 -p 9001:9001 \
              -e MINIO_ROOT_USER=app_factory -e MINIO_ROOT_PASSWORD=app_factory_secret \
              quay.io/minio/minio:latest server /data --console-address ":9001"
            for _ in $(seq 1 30); do
              curl -sf http://localhost:9000/minio/health/live >/dev/null && exit 0
              sleep 1
            done
            echo "MinIO did not become ready"; docker logs minio; exit 1
      - restore_cache:
          keys:
            - gradle-api-v1-{{ checksum "backend/build.gradle.kts" }}
            - gradle-api-v1-
      - run:
          name: platform-api tests
          working_directory: backend
          command: |
            chmod +x gradlew
            ./gradlew :platform-api:test
      - save_cache:
          key: gradle-api-v1-{{ checksum "backend/build.gradle.kts" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_test_results:
          path: backend/platform-api/build/test-results/test
          when: always
      - store_artifacts:
          path: backend/platform-api/build/reports/tests
          destination: platform-api-test-reports
          when: on_fail

  # `flutter analyze` + `flutter test` for one app or package (see the matrix
  # in the `checks` workflow). Packages without a test/ directory only analyze.
  flutter-check:
    parameters:
      package:
        type: string
    docker:
      - image: ubuntu:jammy
    resource_class: large
    environment:
      FLUTTER_HOME: /home/flutter
      PATH: /home/flutter/bin:/home/flutter/bin/cache/dart-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - run:
          name: Install dependencies
          command: |
            apt-get update
            apt-get install -y git openssh-client curl wget unzip xz-utils ca-certificates
      - checkout
      - run:
          name: Install Flutter
          command: |
            mkdir -p /home/flutter
            git clone --depth 1 -b stable https://github.com/flutter/flutter.git /home/flutter
            flutter --version
      - run:
          name: flutter pub get
          working_directory: << parameters.package >>
          command: flutter pub get
      - run:
          name: Generate build files (only where the package uses build_runner)
          working_directory: << parameters.package >>
          command: |
            if grep -q build_runner pubspec.yaml; then
              flutter pub run build_runner build --delete-conflicting-outputs
            else
              echo "no code generation here"
            fi
      - run:
          name: flutter analyze
          working_directory: << parameters.package >>
          command: flutter analyze
      - run:
          name: flutter test
          working_directory: << parameters.package >>
          command: |
            if find test -name '*_test.dart' -type f 2>/dev/null | grep -q .; then
              flutter test --reporter expanded
            else
              echo "WARNING: << parameters.package >> has no *_test.dart files -- nothing to run"
            fi

workflows:
  flutter-ci:
    jobs:
      - build-for-testing:
          filters:
            branches:
              only:
                - test
      - build-android-apk:
          name: build-android-apk-user
          app_dir: apps/user_app
          artifact_name: user-app-release.apk
          filters:
            branches:
              only:
                - test
          requires:
            - build-for-testing
      - build-android-apk:
          name: build-android-apk-business
          app_dir: apps/business_admin
          artifact_name: business-admin-release.apk
          filters:
            branches:
              only:
                - test
          requires:
            - build-for-testing
      - test-platform-admin:
          filters:
            branches:
              only:
                - test
      - build-android-apk:
          name: build-android-apk-platform
          app_dir: apps/platform_admin
          artifact_name: platform-admin-release.apk
          filters:
            branches:
              only:
                - test
          requires:
            - test-platform-admin

  # Test gate. Runs on every branch (unit tests + Flutter), and the heavier
  # platform-api end-to-end run on the long-lived branches only. To save CI
  # quota, narrow the `filters` of the two cheap jobs to develop/test/master.
  checks:
    jobs:
      - backend-unit-tests
      - flutter-check:
          matrix:
            parameters:
              package:
                - apps/user_app
                - apps/business_admin
                - apps/platform_admin
                - packages/core_network
                - packages/core_region
                - packages/core_storage
                - packages/core_ui
      - backend-api-tests:
          filters:
            branches:
              only:
                - develop
                - test
                - master

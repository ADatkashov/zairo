spring:
  application:
    name: app-factory-platform-api
  # Without this, bean-validation messages ("must not be blank" etc.) come
  # out in whatever locale the OS the JVM runs on defaults to — this
  # machine is Russian, which mismatched every other English error string
  # in ApiError. Fixed to English regardless of deploy host; this is a
  # separate concern from the OpenAPI/Swagger *documentation* localization
  # (en/ru/kk) — that's about the docs text, not the live API's error body.
  web:
    locale: en
    locale-resolver: fixed
  datasource:
    # ${VAR:dev-default} on every line below on purpose (see app.jwt.secret's
    # comment for why) — Spring already lets an OS env var override any of
    # these without this syntax, but leaving them as bare literals makes it
    # invisible that a real deployment MUST override them: forget to set
    # DB_PASSWORD/JWT_SECRET/etc. and production silently runs on the exact
    # dev-only values already sitting in this file's git history. The
    # placeholder makes "override this" explicit and greppable instead.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_factory}
    username: ${DB_USERNAME:app_factory}
    password: ${DB_PASSWORD:app_factory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  # Falls back to PORT (Render/Heroku-style platforms set this, not
  # SERVER_PORT, and require the app to actually bind to it to route
  # traffic in) before the local dev default — SERVER_PORT still wins if
  # both happen to be set, so nothing changes for an existing deployment
  # that already sets SERVER_PORT explicitly.
  port: ${SERVER_PORT:${PORT:8080}}

app:
  cors:
    # See WebConfig's doc comment — comma-separated, no code change needed
    # to add a real deployed frontend's origin later.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  jwt:
    # Dev-only secret, fine to commit for local/test — but now behind
    # ${JWT_SECRET:...} so a real deployment can (and must) override it via
    # env var. Whoever sets up staging/production: this specific value has
    # been public in git history since early in the project — treat it as
    # burned, generate a fresh one, never reuse it for anything real.
    secret: ${JWT_SECRET:Jc65IChbJdrOLj/C4rT+OCdPEdvzosIIpIG0xYM9dJ1Eflr/QDsOg+hLKOdX8k1B}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
    # A second, independent secret for platform-admin tokens (see
    # platformadmin.PlatformAdminJwtService) — deliberately not the same
    # value as app.jwt.secret above. A customer/business access token must
    # fail signature verification here, not merely fail a role check; two
    # different keys is what makes that a structural guarantee instead of a
    # convention someone could get wrong later. Same burned-once-public,
    # override-before-real-deployment caveat as above applies.
    platform-admin-secret: ${PLATFORM_ADMIN_JWT_SECRET:R2v8QnZmU4hLxE0pTsYkD9bWcAoFj3GiN6uHrMz1XqCvS7eKtY5wPd2LbNhOaIu}
    platform-admin-access-token-ttl-minutes: 30
  auth:
    # Short-lived on purpose — a reset code is meant to be used within
    # minutes of requesting it, not carried around like a refresh token.
    password-reset-token-ttl-minutes: 60
    # Brute-force protection on /auth/login — see LoginAttemptLimiter.
    login-attempt-limit: 5
    login-lockout-minutes: 15
  platform:
    # Single-market MVP assumption (Factory Blueprint §6) — no per-service
    # currency lookup yet. Booking is the one place this is read (Payment
    # now inherits currency from the booking it's charging, not its own
    # copy of this value — see the Money migration in SESSION_NOTES.md).
    default-currency: USD
  storage:
    # MinIO from infrastructure/docker-compose.yml locally; a real
    # deployment overrides these to point at either a real MinIO/S3
    # instance or a managed object-storage bucket. Same
    # committed-dev-defaults-are-not-secrets-once-in-git-history status as
    # the JWT secrets above.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:app_factory}
    secret-key: ${MINIO_SECRET_KEY:app_factory_secret}
    bucket: ${MINIO_BUCKET:factory-media}
  openapi:
    # Swagger UI's environment picker (see OpenApiConfig) — add a Test/
    # Production entry here once one is actually deployed. Never hardcode
    # a real URL in Java for this.
    servers:
      - url: http://localhost:8080
        description: Local

# See ADR-0006 (docs/adr/0006-payment-provider-freedompay.md) for the full
# design behind this block. Every field here is real (docs.freedompay.kz),
# not a generic payment-gateway template — no webhook-secret field, because
# Freedom Pay doesn't have a separate one (see FreedomPayProperties).
payment:
  # mock (local/test, default) | freedompay (staging/production).
  provider: ${PAYMENT_PROVIDER:mock}
  # Where the customer's browser lands after hosted checkout — generic to
  # any redirect-based provider (not Freedom-Pay-specific: Stripe Checkout
  # would need the exact same pair), which is why this sits under `payment`
  # and not `payment.freedompay`. payments.PaymentsService and
  # subscriptions.SubscriptionService read these directly; the provider
  # adapters only forward whatever they're given.
  return:
    success-url: ${PAYMENT_SUCCESS_URL:}
    failure-url: ${PAYMENT_FAILURE_URL:}
  freedompay:
    # No hardcoded default for either environment on purpose — there's no
    # confirmed separate sandbox host (ADR-0006, Open Questions #2), so
    # staging and production both set this explicitly rather than
    # inheriting a guessed value.
    api-url: ${FREEDOMPAY_API_URL:}
    merchant-id: ${FREEDOMPAY_MERCHANT_ID:}
    secret-key: ${FREEDOMPAY_SECRET_KEY:}
    # Unconfirmed (ADR-0006, Open Questions #6) — see
    # FreedomPayWebhookVerifier's own TODO before relying on this in
    # production.
    result-notify-script-name: ${FREEDOMPAY_RESULT_NOTIFY_SCRIPT_NAME:result.php}

booking:
  # How long a booking can sit in PENDING_PAYMENT before the sweep job
  # cancels it and releases the slot — see booking.BookingPaymentTimeoutJob.
  payment-timeout-minutes: ${BOOKING_PAYMENT_TIMEOUT_MINUTES:15}

# Smart Fill Engine (see smartfill's own package-info.java). Every tunable
# the feature needs is here, not hardcoded in the module — see
# SmartFillProperties.
smartfill:
  staging:
    # Candidates contacted per stage, and how long to wait before trying
    # the next stage if the slot's still open — see SmartFillCampaignService.
    batch-size: ${SMARTFILL_BATCH_SIZE:3}
    stage-delay-minutes: ${SMARTFILL_STAGE_DELAY_MINUTES:15}
    # A campaign never sends more than this many stages, even if the
    # candidate pool is bigger.
    max-stages: ${SMARTFILL_MAX_STAGES:4}
    max-candidates-per-campaign: ${SMARTFILL_MAX_CANDIDATES_PER_CAMPAIGN:20}
    # Hard ceiling on a campaign's total lifetime, regardless of the slot's
    # own start time (which usually ends it sooner).
    campaign-max-duration-minutes: ${SMARTFILL_CAMPAIGN_MAX_DURATION_MINUTES:180}
  antispam:
    per-user-cooldown-hours: ${SMARTFILL_PER_USER_COOLDOWN_HOURS:6}
    per-business-cooldown-days: ${SMARTFILL_PER_BUSINESS_COOLDOWN_DAYS:7}
    decline-cooldown-days: ${SMARTFILL_DECLINE_COOLDOWN_DAYS:14}
    max-daily-notifications-per-user: ${SMARTFILL_MAX_DAILY_NOTIFICATIONS:3}
    max-weekly-notifications-per-user: ${SMARTFILL_MAX_WEEKLY_NOTIFICATIONS:10}
  scoring:
    recent-visit-window-days: ${SMARTFILL_RECENT_VISIT_WINDOW_DAYS:90}
    recent-engagement-window-days: ${SMARTFILL_RECENT_ENGAGEMENT_WINDOW_DAYS:30}
    suitable-time-tolerance-minutes: ${SMARTFILL_SUITABLE_TIME_TOLERANCE_MINUTES:60}
    # See ScoringFactor for what each key means. Not hardcoded anywhere in
    # the scoring engine — change priority by editing this map alone.
    weights:
      FOLLOWS_PROVIDER: 15
      PREVIOUSLY_BOOKED_SAME_EMPLOYEE: 25
      RECENTLY_VISITED_PROVIDER: 20
      PREVIOUSLY_BOOKED_SAME_SERVICE: 20
      PREVIOUS_PROVIDER_BOOKING: 10
      CATEGORY_INTEREST: 5
      SUITABLE_HISTORICAL_TIME: 10
      RECENT_ENGAGEMENT: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    # http://localhost:8080/swagger-ui/index.html — this is springdoc's own
    # default path already; do NOT set swagger-ui.path to that same string
    # ("/swagger-ui/index.html"), it gets appended under the default
    # "/swagger-ui" mapping and 404s at "/swagger-ui/swagger-ui/index.html"
    # instead. Leave unset.
    # tagsSorter intentionally not set to "alpha" — leaving it unset keeps
    # the declaration order OpenApiConfig's tags() list defines, matching
    # the module reading order (Auth -> Users -> Providers -> ...).
    operationsSorter: method
    # Lets "Try it out" send the Authorization header set via Authorize
    # across every request in the session, not just the one endpoint.
    persistAuthorization: true
  api-docs:
    # http://localhost:8080/v3/api-docs (JSON) and /v3/api-docs.yaml (YAML,
    # springdoc serves this automatically alongside the JSON path).
    path: /v3/api-docs
  show-actuator: false
  cache:
    # With caching on, info/components (title, description, security scheme
    # hint) are computed once and reused verbatim across every language
    # group, so LocalizingOpenApiCustomizer never gets a chance to touch
    # them for /v3/api-docs/ru|kk (only paths/tags, rebuilt per request,
    # were actually being translated). Disabling the cache costs a bit of
    # per-request CPU on doc generation — fine for a docs endpoint.
    disabled: true
  # Master on/off switch for both the UI and the raw JSON/YAML docs — set
  # both false (e.g. via SPRINGDOC_SWAGGER_UI_ENABLED=false /
  # SPRINGDOC_API_DOCS_ENABLED=false, or an application-prod.yml once a
  # real prod profile exists) to fully disable Swagger outside local/test.

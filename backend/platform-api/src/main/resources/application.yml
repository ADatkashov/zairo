spring:
  application:
    name: app-factory-platform-api
  datasource:
    url: jdbc:postgresql://localhost:5432/app_factory
    username: app_factory
    password: app_factory
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

app:
  jwt:
    # Dev-only secret, fine to commit — must move to an env var / secrets
    # manager before any real deployment (Phase 7 Production per the
    # Factory Blueprint roadmap, §13).
    secret: "Jc65IChbJdrOLj/C4rT+OCdPEdvzosIIpIG0xYM9dJ1Eflr/QDsOg+hLKOdX8k1B"
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
  payments:
    # Single-market MVP assumption (Factory Blueprint §6) — no per-service
    # currency lookup yet.
    currency: USD
  storage:
    # MinIO from infrastructure/docker-compose.yml. Dev-only credentials,
    # same "fine to commit, move to secrets before real deployment" status
    # as the JWT secret above.
    endpoint: http://localhost:9000
    access-key: app_factory
    secret-key: app_factory_secret
    bucket: factory-media

management:
  endpoints:
    web:
      exposure:
        include: health,info

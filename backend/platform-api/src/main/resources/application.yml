spring:
  application:
    name: app-factory-platform-api
  # Without this, bean-validation messages ("must not be blank" etc.) come
  # out in whatever locale the OS the JVM runs on defaults to — this
  # machine is Russian, which mismatched every other English error string
  # in ApiError. Fixed to English regardless of deploy host; this is a
  # separate concern from the OpenAPI/Swagger *documentation* localization
  # (en/ru/kk) — that's about the docs text, not the live API's error body.
  web:
    locale: en
    locale-resolver: fixed
  datasource:
    # ${VAR:dev-default} on every line below on purpose (see app.jwt.secret's
    # comment for why) — Spring already lets an OS env var override any of
    # these without this syntax, but leaving them as bare literals makes it
    # invisible that a real deployment MUST override them: forget to set
    # DB_PASSWORD/JWT_SECRET/etc. and production silently runs on the exact
    # dev-only values already sitting in this file's git history. The
    # placeholder makes "override this" explicit and greppable instead.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app_factory}
    username: ${DB_USERNAME:app_factory}
    password: ${DB_PASSWORD:app_factory}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  # Falls back to PORT (Render/Heroku-style platforms set this, not
  # SERVER_PORT, and require the app to actually bind to it to route
  # traffic in) before the local dev default — SERVER_PORT still wins if
  # both happen to be set, so nothing changes for an existing deployment
  # that already sets SERVER_PORT explicitly.
  port: ${SERVER_PORT:${PORT:8080}}

app:
  cors:
    # See WebConfig's doc comment — comma-separated, no code change needed
    # to add a real deployed frontend's origin later.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}
  jwt:
    # Dev-only secret, fine to commit for local/test — but now behind
    # ${JWT_SECRET:...} so a real deployment can (and must) override it via
    # env var. Whoever sets up staging/production: this specific value has
    # been public in git history since early in the project — treat it as
    # burned, generate a fresh one, never reuse it for anything real.
    # ProductionSecretsValidator refuses to boot on this exact value (or a
    # blank one) when SPRING_PROFILES_ACTIVE=prod — see that class and
    # docs/ci-cd.md §12.
    secret: ${JWT_SECRET:Jc65IChbJdrOLj/C4rT+OCdPEdvzosIIpIG0xYM9dJ1Eflr/QDsOg+hLKOdX8k1B}
    access-token-ttl-minutes: 30
    refresh-token-ttl-days: 30
    # A second, independent secret for platform-admin tokens (see
    # platformadmin.PlatformAdminJwtService) — deliberately not the same
    # value as app.jwt.secret above. A customer/business access token must
    # fail signature verification here, not merely fail a role check; two
    # different keys is what makes that a structural guarantee instead of a
    # convention someone could get wrong later. Same burned-once-public,
    # override-before-real-deployment caveat as above applies.
    platform-admin-secret: ${PLATFORM_ADMIN_JWT_SECRET:R2v8QnZmU4hLxE0pTsYkD9bWcAoFj3GiN6uHrMz1XqCvS7eKtY5wPd2LbNhOaIu}
    platform-admin-access-token-ttl-minutes: 30
  auth:
    # Short-lived on purpose — a reset code is meant to be used within
    # minutes of requesting it, not carried around like a refresh token.
    password-reset-token-ttl-minutes: 60
    # Brute-force protection on /auth/login — see LoginAttemptLimiter.
    login-attempt-limit: 5
    login-lockout-minutes: 15
  # Google/Facebook sign-in (see auth's GoogleIdTokenVerifierAdapter /
  # FacebookGraphIdentityVerifier). No dev-default value for any of these —
  # unlike app.jwt.secret above, there's no meaningful "dev secret" for an
  # OAuth client id/app secret; local dev without them still works for
  # every *other* login method, but POST /auth/google and /auth/facebook
  # themselves need real values (see docs/authentication.md's "Provider
  # configuration" section for exactly what to create and where to put it).
  oauth:
    google:
      # Comma-separated: the Android client id, the iOS client id, and
      # (optional) a web client id — every audience a real Google ID token
      # from one of ZAIRO's own apps can carry. Blank means "accept any
      # audience", which GoogleIdTokenVerifierAdapter only allows outside
      # spring.profiles.active=prod (see ProductionSecretsValidator).
      client-ids: ${GOOGLE_OAUTH_CLIENT_IDS:}
    apple:
      # Comma-separated audiences of Sign in with Apple identity tokens: the
      # iOS bundle id (and a Services ID if Android/web is added). Blank
      # means "accept any audience", which is only allowed outside prod.
      client-ids: ${APPLE_CLIENT_IDS:}
    facebook:
      app-id: ${FACEBOOK_APP_ID:}
      app-secret: ${FACEBOOK_APP_SECRET:}
  # Passkeys (WebAuthn). Leave PASSKEY_RP_ID unset to turn passkeys off (the
  # app then hides the buttons). The RP id is the domain passkeys are bound
  # to and is PERMANENT: changing it later orphans every registered passkey.
  # It must be a domain the backend answers on (e.g. api.example.com), since
  # the backend serves /.well-known/apple-app-site-association and
  # /.well-known/assetlinks.json itself.
  passkey:
    rp-id: ${PASSKEY_RP_ID:}
    rp-name: ${PASSKEY_RP_NAME:ZAIRO}
    # iOS: "<Apple TeamID>.<bundle id>", comma-separated (e.g. ABCDE12345.com.zairo).
    apple-app-ids: ${PASSKEY_APPLE_APP_IDS:}
    android-package: ${PASSKEY_ANDROID_PACKAGE:com.zairo}
    # SHA-256 fingerprints (AA:BB:...) of the Android app signing certificate(s),
    # comma-separated: debug + release/Play App Signing. Also derives the
    # android:apk-key-hash origins accepted by WebAuthn verification.
    android-sha256-fingerprints: ${PASSKEY_ANDROID_SHA256_FINGERPRINTS:}
    extra-origins: ${PASSKEY_EXTRA_ORIGINS:}
  # SMS delivery for phone OTP (see auth's TwilioOtpSender). Leave
  # TWILIO_ACCOUNT_SID unset and the code is only written to the server log
  # (LoggingOtpSender) — fine for local dev/CI, never for real users. Set
  # TWILIO_AUTH_TOKEN plus either TWILIO_FROM (a Twilio number, E.164) or
  # TWILIO_MESSAGING_SERVICE_SID.
  sms:
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
      messaging-service-sid: ${TWILIO_MESSAGING_SERVICE_SID:}
  # Phone + OTP sign-in (see auth's PhoneOtpService). Tuned for a 6-digit
  # SMS code: short-lived, a real resend cooldown, and a low hourly cap —
  # see CLAUDE.md task spec §7's OTP abuse-protection requirements.
  otp:
    ttl-minutes: 5
    resend-cooldown-seconds: 60
    max-verify-attempts: 5
    max-requests-per-hour: 5
    # SMS-pumping fraud limits (bots requesting codes for many numbers burn
    # SMS budget): per client IP per hour, and a platform-wide daily cap that
    # acts as a circuit breaker (503 once reached). Size the daily cap to
    # your real traffic and SMS budget.
    max-requests-per-ip-per-hour: ${OTP_MAX_REQUESTS_PER_IP_PER_HOUR:20}
    daily-send-cap: ${OTP_DAILY_SEND_CAP:3000}
    # SMS codes are only sent to these ISO country codes (comma-separated);
    # empty = any country. +7 is shared: KZ for 7xx numbers, RU for 9xx.
    allowed-countries: ${OTP_ALLOWED_COUNTRIES:KZ}
    # How many reverse proxies in front of the app append to X-Forwarded-For
    # (1 = one platform load balancer such as Render; 0 = ignore the header,
    # app exposed directly). Used to find the real client IP for the per-IP limit.
    trusted-proxy-hops: ${OTP_TRUSTED_PROXY_HOPS:1}
  platform:
    # Single-market MVP assumption (Factory Blueprint §6) — no per-service
    # currency lookup yet. Booking is the one place this is read (Payment
    # now inherits currency from the booking it's charging, not its own
    # copy of this value — see the Money migration in SESSION_NOTES.md).
    default-currency: USD
  storage:
    # MinIO from infrastructure/docker-compose.yml locally; a real
    # deployment overrides these to point at either a real MinIO/S3
    # instance or a managed object-storage bucket. Same
    # committed-dev-defaults-are-not-secrets-once-in-git-history status as
    # the JWT secrets above.
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:app_factory}
    secret-key: ${MINIO_SECRET_KEY:app_factory_secret}
    bucket: ${MINIO_BUCKET:factory-media}
  openapi:
    # Swagger UI's environment picker (see OpenApiConfig) — add a Test/
    # Production entry here once one is actually deployed. Never hardcode
    # a real URL in Java for this.
    servers:
      - url: http://localhost:8080
        description: Local

# See ADR-0006 (docs/adr/0006-payment-provider-freedompay.md) for the full
# design behind this block. Every field here is real (docs.freedompay.kz),
# not a generic payment-gateway template — no webhook-secret field, because
# Freedom Pay doesn't have a separate one (see FreedomPayProperties).
payment:
  # mock (local/test, default) | freedompay (staging/production).
  provider: ${PAYMENT_PROVIDER:mock}
  # ZAIRO's marketplace commission, as a fraction of the payment amount
  # (0.10 = 10%) — see ADR-0007 (docs/adr/0007-marketplace-commission-and-settlement.md)
  # and payments.CommissionCalculator. Applied uniformly to every booking
  # payment; there is no per-business/per-service override today (no real
  # product requirement for one yet).
  commission:
    rate: ${PAYMENT_COMMISSION_RATE:0.10}
  # Where the customer's browser lands after hosted checkout — generic to
  # any redirect-based provider (not Freedom-Pay-specific: Stripe Checkout
  # would need the exact same pair), which is why this sits under `payment`
  # and not `payment.freedompay`. payments.PaymentsService and
  # subscriptions.SubscriptionService read these directly; the provider
  # adapters only forward whatever they're given.
  return:
    success-url: ${PAYMENT_SUCCESS_URL:}
    failure-url: ${PAYMENT_FAILURE_URL:}
  freedompay:
    # No hardcoded default for either environment on purpose — there's no
    # confirmed separate sandbox host (ADR-0006, Open Questions #2), so
    # staging and production both set this explicitly rather than
    # inheriting a guessed value.
    api-url: ${FREEDOMPAY_API_URL:}
    merchant-id: ${FREEDOMPAY_MERCHANT_ID:}
    secret-key: ${FREEDOMPAY_SECRET_KEY:}
    # Unconfirmed (ADR-0006, Open Questions #6) — see
    # FreedomPayWebhookVerifier's own TODO before relying on this in
    # production.
    result-notify-script-name: ${FREEDOMPAY_RESULT_NOTIFY_SCRIPT_NAME:result.php}

booking:
  # How long a booking can sit in PENDING_PAYMENT before the sweep job
  # cancels it and releases the slot — see booking.BookingPaymentTimeoutJob.
  payment-timeout-minutes: ${BOOKING_PAYMENT_TIMEOUT_MINUTES:15}

# Smart Fill Engine (see smartfill's own package-info.java). Every tunable
# the feature needs is here, not hardcoded in the module — see
# SmartFillProperties.
smartfill:
  staging:
    # Candidates contacted per stage, and how long to wait before trying
    # the next stage if the slot's still open — see SmartFillCampaignService.
    batch-size: ${SMARTFILL_BATCH_SIZE:3}
    stage-delay-minutes: ${SMARTFILL_STAGE_DELAY_MINUTES:15}
    # A campaign never sends more than this many stages, even if the
    # candidate pool is bigger.
    max-stages: ${SMARTFILL_MAX_STAGES:4}
    max-candidates-per-campaign: ${SMARTFILL_MAX_CANDIDATES_PER_CAMPAIGN:20}
    # Hard ceiling on a campaign's total lifetime, regardless of the slot's
    # own start time (which usually ends it sooner).
    campaign-max-duration-minutes: ${SMARTFILL_CAMPAIGN_MAX_DURATION_MINUTES:180}
  antispam:
    per-user-cooldown-hours: ${SMARTFILL_PER_USER_COOLDOWN_HOURS:6}
    per-business-cooldown-days: ${SMARTFILL_PER_BUSINESS_COOLDOWN_DAYS:7}
    decline-cooldown-days: ${SMARTFILL_DECLINE_COOLDOWN_DAYS:14}
    max-daily-notifications-per-user: ${SMARTFILL_MAX_DAILY_NOTIFICATIONS:3}
    max-weekly-notifications-per-user: ${SMARTFILL_MAX_WEEKLY_NOTIFICATIONS:10}
  scoring:
    recent-visit-window-days: ${SMARTFILL_RECENT_VISIT_WINDOW_DAYS:90}
    recent-engagement-window-days: ${SMARTFILL_RECENT_ENGAGEMENT_WINDOW_DAYS:30}
    suitable-time-tolerance-minutes: ${SMARTFILL_SUITABLE_TIME_TOLERANCE_MINUTES:60}
    # See ScoringFactor for what each key means. Not hardcoded anywhere in
    # the scoring engine — change priority by editing this map alone.
    weights:
      FOLLOWS_PROVIDER: 15
      PREVIOUSLY_BOOKED_SAME_EMPLOYEE: 25
      RECENTLY_VISITED_PROVIDER: 20
      PREVIOUSLY_BOOKED_SAME_SERVICE: 20
      PREVIOUS_PROVIDER_BOOKING: 10
      CATEGORY_INTEREST: 5
      SUITABLE_HISTORICAL_TIME: 10
      RECENT_ENGAGEMENT: 5
      DUE_FOR_REBOOKING: 10

# Rebook Engine (see rebookengine's own package-info.java). Every tunable
# the feature needs is here, not hardcoded in the module -- see
# RebookProperties.
rebook:
  # A customer needs at least this many COMPLETED visits with a provider
  # (including the one that just completed) before ZAIRO tries to establish
  # a usual visit interval for them at all.
  min-visits-to-establish-interval: ${REBOOK_MIN_VISITS:2}
  # The computed average gap between visits is clamped into this range --
  # guards against one outlier pair of visits predicting an absurd cadence.
  min-interval-days: ${REBOOK_MIN_INTERVAL_DAYS:7}
  max-interval-days: ${REBOOK_MAX_INTERVAL_DAYS:180}
  # How long after the nudge goes out to wait for a rebooking before giving up.
  follow-up-window-days: ${REBOOK_FOLLOW_UP_WINDOW_DAYS:14}
  # RebookStrategy#evaluate's probability estimate -- a flat heuristic today
  # (see that class's own doc comment on where a future ML model would slot in).
  base-probability: ${REBOOK_BASE_PROBABILITY:0.35}

# Customer Intelligence (see customerintelligence's own package-info.java).
# Every threshold RetentionCalculator/CustomerValueCalculator use is here,
# not hardcoded in either class -- same reasoning as smartfill/rebook above.
customer-intelligence:
  interval:
    # Fewer completed visits than this and averageVisitIntervalDays stays
    # null -- a single visit establishes no cadence.
    min-completed-visits-for-interval: ${CI_MIN_VISITS_FOR_INTERVAL:2}
  retention:
    # Days-since-last-visit up to this multiple of the average interval is
    # still ACTIVE; beyond it, DUE_FOR_REBOOKING; beyond at-risk-factor,
    # AT_RISK; beyond inactive-factor, INACTIVE. See RetentionCalculator's
    # own worked example.
    due-soon-factor: ${CI_DUE_SOON_FACTOR:1.15}
    at-risk-factor: ${CI_AT_RISK_FACTOR:2.0}
    inactive-factor: ${CI_INACTIVE_FACTOR:3.0}
    # Fallback flat windows for a customer with only one visit ever (no
    # established interval to multiply against).
    single-visit-active-window-days: ${CI_SINGLE_VISIT_ACTIVE_WINDOW_DAYS:60}
    single-visit-at-risk-window-days: ${CI_SINGLE_VISIT_AT_RISK_WINDOW_DAYS:120}
  value:
    # Caps that alone max out their factor at 1.0 -- see CustomerValueCalculator.
    max-completed-bookings-for-score: ${CI_VALUE_MAX_BOOKINGS:20}
    max-total-spent-for-score: ${CI_VALUE_MAX_SPENT:2000}
    recency-window-days: ${CI_VALUE_RECENCY_WINDOW_DAYS:180}
    # Blend weights -- normalized against their own sum, so they need not add to 1.
    completed-bookings-weight: ${CI_VALUE_WEIGHT_BOOKINGS:0.30}
    total-spent-weight: ${CI_VALUE_WEIGHT_SPENT:0.30}
    attendance-weight: ${CI_VALUE_WEIGHT_ATTENDANCE:0.15}
    recency-weight: ${CI_VALUE_WEIGHT_RECENCY:0.15}
    repeat-relationship-weight: ${CI_VALUE_WEIGHT_REPEAT:0.10}

# Lost Customer Recovery (see reactivationengine's own package-info.java).
# Every tunable the feature needs is here, not hardcoded in the module --
# see ReactivationProperties.
reactivation:
  # The daily sweep's SQL floor -- a pair whose last visit is more recent
  # than this is never even considered, regardless of their usual cadence.
  scan-minimum-inactivity-days: ${REACTIVATION_SCAN_MINIMUM_INACTIVITY_DAYS:45}
  # Once a customer has an established average interval, their inactivity
  # must clear (average interval x this) to count as "lost" rather than
  # just "due" (Rebook's territory).
  interval-multiplier: ${REACTIVATION_INTERVAL_MULTIPLIER:2.0}
  # Regardless of any established pattern (or lack of one), this many days
  # of inactivity always qualifies -- the safety net for a single-visit
  # customer with no cadence to compare against.
  absolute-max-inactivity-days: ${REACTIVATION_ABSOLUTE_MAX_INACTIVITY_DAYS:120}
  # Longer than Rebook's follow-up window -- a colder lead is given more
  # time to respond before the campaign gives up.
  follow-up-window-days: ${REACTIVATION_FOLLOW_UP_WINDOW_DAYS:30}
  # ReactivationStrategy#evaluate's probability estimate -- lower than
  # Rebook's since these are colder leads by construction.
  base-probability: ${REACTIVATION_BASE_PROBABILITY:0.15}

# Rating system configuration (see reviews' ReviewSummaryService,
# ProviderRatingSummary, and search's SearchService for usage).
rating:
  # Bayesian rating for ranking: minimum review count threshold to avoid
  # single-review bias. A provider with fewer reviews gets pulled toward the
  # global average. This value (m) controls how much weight the global average
  # has: (n / (n + m)) * providerRating + (m / (n + m)) * globalRating.
  # Higher m = more conservative: single 5-star review still gets ranked low.
  # Lower m = more aggressive: new providers rank higher sooner.
  # Production default: 25 (a provider needs ~25 reviews to fully trust their own average).
  bayesian:
    min-reviews-for-confidence: ${RATING_BAYESIAN_MIN_REVIEWS:25}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    # http://localhost:8080/swagger-ui/index.html — this is springdoc's own
    # default path already; do NOT set swagger-ui.path to that same string
    # ("/swagger-ui/index.html"), it gets appended under the default
    # "/swagger-ui" mapping and 404s at "/swagger-ui/swagger-ui/index.html"
    # instead. Leave unset.
    # tagsSorter intentionally not set to "alpha" — leaving it unset keeps
    # the declaration order OpenApiConfig's tags() list defines, matching
    # the module reading order (Auth -> Users -> Providers -> ...).
    operationsSorter: method
    # Lets "Try it out" send the Authorization header set via Authorize
    # across every request in the session, not just the one endpoint.
    persistAuthorization: true
  api-docs:
    # http://localhost:8080/v3/api-docs (JSON) and /v3/api-docs.yaml (YAML,
    # springdoc serves this automatically alongside the JSON path).
    path: /v3/api-docs
  show-actuator: false
  cache:
    # With caching on, info/components (title, description, security scheme
    # hint) are computed once and reused verbatim across every language
    # group, so LocalizingOpenApiCustomizer never gets a chance to touch
    # them for /v3/api-docs/ru|kk (only paths/tags, rebuilt per request,
    # were actually being translated). Disabling the cache costs a bit of
    # per-request CPU on doc generation — fine for a docs endpoint.
    disabled: true
  # Master on/off switch for both the UI and the raw JSON/YAML docs — set
  # both false (e.g. via SPRINGDOC_SWAGGER_UI_ENABLED=false /
  # SPRINGDOC_API_DOCS_ENABLED=false, or an application-prod.yml once a
  # real prod profile exists) to fully disable Swagger outside local/test.

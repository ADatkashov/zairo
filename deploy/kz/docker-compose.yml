# Production on ONE VPS located in Kazakhstan. Everything that stores data
# (PostgreSQL, uploaded images, backups, logs) runs on this machine; nothing
# here talks to a foreign storage service. See README.md for the full guide.
#
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
#
# Only Caddy (80/443) is published to the internet. Postgres, MinIO and the
# backend are reachable only inside the compose network.
name: zairo

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Heap = 75% of this limit (see backend/Dockerfile).
    mem_limit: ${BACKEND_MEM_LIMIT:-1536m}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-zairo}
      DB_USERNAME: ${POSTGRES_USER:-zairo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PLATFORM_ADMIN_JWT_SECRET: ${PLATFORM_ADMIN_JWT_SECRET:?set PLATFORM_ADMIN_JWT_SECRET in .env}
      # Images live in MinIO on this same server (S3 API, internal network only).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-zairo}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-zairo-media}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      # Caddy is the one reverse proxy in front of the app (real client IP for rate limits).
      OTP_TRUSTED_PROXY_HOPS: "1"
      OTP_ALLOWED_COUNTRIES: ${OTP_ALLOWED_COUNTRIES:-KZ}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      PAYMENT_SUCCESS_URL: ${PAYMENT_SUCCESS_URL:-}
      PAYMENT_FAILURE_URL: ${PAYMENT_FAILURE_URL:-}
      FREEDOMPAY_API_URL: ${FREEDOMPAY_API_URL:-}
      FREEDOMPAY_MERCHANT_ID: ${FREEDOMPAY_MERCHANT_ID:-}
      FREEDOMPAY_SECRET_KEY: ${FREEDOMPAY_SECRET_KEY:-}
      # The prod profile refuses to start without these (see ProductionSecretsValidator).
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      OTP_MOCK_CODE: ${OTP_MOCK_CODE:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal, edge]
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zairo}
      POSTGRES_USER: ${POSTGRES_USER:-zairo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  # S3-compatible storage for photos; the backend proxies downloads, so this is never exposed.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zairo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET:-zairo-media}
      MINIO_BROWSER: "off"
    volumes:
      - minio_data:/bitnami/minio/data
    networks: [internal]
    logging: *logging

  # Nightly dump of Postgres + a copy of the image storage into ./backups (on this server).
  # Copy ./backups to a SECOND Kazakhstan location too: a backup on the same disk is not a backup.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-zairo}
      PGUSER: ${POSTGRES_USER:-zairo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
      - minio_data:/minio-data:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

networks:
  internal:
    internal: true
  edge: {}

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app_factory
      POSTGRES_USER: app_factory
      POSTGRES_PASSWORD: app_factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local dev (media, portfolio photos, ...)
  minio:
    # MinIO no longer publishes images; Bitnami's frozen copy of the same server,
    # pinned to a tag. Its entrypoint starts the server, so there is no command.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: app_factory
      MINIO_ROOT_PASSWORD: app_factory_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

volumes:
  postgres_data:
  minio_data:

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app_factory
      POSTGRES_USER: app_factory
      POSTGRES_PASSWORD: app_factory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage for local dev (media, portfolio photos, ...)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: app_factory
      MINIO_ROOT_PASSWORD: app_factory_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
